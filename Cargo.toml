[workspace]
resolver = "2"
members = ["crates/hodgeker", "crates/hodgeker-cli"]
default-members = ["crates/hodgeker", "crates/hodgeker-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.74"
repository = "https://github.com/amineux/HodgeKer"
homepage = "https://github.com/amineux/HodgeKer"
description = "Hodge compositional Matérn / Hodgelet kernels on simplicial 2-complexes"
keywords = ["hodge", "gaussian-process", "simplicial", "kernel", "discrete-calculus"]
categories = ["science", "mathematics"]

[workspace.dependencies]
# Pinned so the tree builds on rustc 1.83 (this environment) as well as current stable.
nalgebra = "=0.33.3"
sprs = "=0.11.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "=2.0.11"
rand = "0.8"
rand_chacha = "0.3"
approx = "0.5"
clap = { version = "=4.5.41", features = ["derive"] }
anyhow = "1"
